[package]
name = "shared"
version = "0.4.6"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
walkdir = "2.4"
maplit = "1.0"
lazy_static = "1.4"
once_cell = "1.18"
toml = "1.1.4+spec-1.1.0"
clap = { version = "4.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["blocking", "rustls"], default-features = false }
spinners = "4"
zip = "8.1"
tar = "0.4"
glob = "0.3"
tempfile = "3"
flate2 = "1"
git2 = { version = "0.21.0", default-features = false }
which = "8.0.0"
dirs = "6.0.0"
